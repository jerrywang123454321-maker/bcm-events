  }
  var had = saved();
  var tries = [fromLink(), had].filter(Boolean);
  for (var i = 0; i < tries.length; i++) {
    try { var opened = await decrypt(bytes(tries[i])); if (!had) firstUnlock("link"); keep(tries[i]); show(opened); return; } catch (e) {}
  }
  forget();
  lock.hidden = false; input.focus();
  if ((window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone) {
    document.querySelector("[data-standalone]").hidden = false;
  }
  // A share link opened in this same tab only changes the part after "#", which doesn't reload the page: try it now.
  window.addEventListener("hashchange", async function () {
    var k = fromLink();
    if (!k) return;
    try { var opened = await decrypt(bytes(k)); firstUnlock("link"); keep(k); show(opened); }
    catch (e) { err.textContent = "That link didn't unlock the site (it may be from before a password change). Type the password instead."; err.hidden = false; }
  });
  form.addEventListener("submit", async function (ev) {
    ev.preventDefault(); err.hidden = true; err.textContent = errText;
    var btn = form.querySelector("button"); btn.disabled = true; btn.textContent = "Unlocking…";
    try {
      var pw = new TextEncoder().encode(input.value.trim().toLowerCase());
      var base = await crypto.subtle.importKey("raw", pw, "PBKDF2", false, ["deriveBits"]);
      var raw = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: hex(env.salt), iterations: env.iter }, base, 256);
      var page = await decrypt(new Uint8Array(raw));
      firstUnlock("password");
      keep(b64(raw));
      show(page);
    } catch (e) {
      err.hidden = false; btn.disabled = false; btn.textContent = "Unlock"; input.select();
    }
  });
})();
</script>
