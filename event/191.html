    var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: blob.slice(0, 12) }, key, blob.slice(12));
    return new TextDecoder().decode(plain);
  }
  function show(page) {
    page = page.split(env.gen_iso_token).join(env.generated_iso).split(env.gen_token).join(env.generated);
    // Replace the whole document only after this one has fully loaded: earlier, write() appends instead of replacing,
    // and the unlocked page's scripts don't run.
    var swap = function () { document.open(); document.write(page); document.close(); };
    if (document.readyState === "complete") swap(); else window.addEventListener("load", swap);
  }
  function saved() { try { return localStorage.getItem(slot) || sessionStorage.getItem(slot); } catch (e) { return null; } }
  function keep(raw) { try { localStorage.setItem(slot, raw); sessionStorage.setItem(slot, raw); } catch (e) {} }
  // Tells the unlocked page this device just unlocked for the first time, so it can count it (anonymously).
  function firstUnlock(how) { try { sessionStorage.setItem("unlocked-via", how); } catch (e) {} }
  function forget() { try { sessionStorage.removeItem(slot); localStorage.removeItem(slot); } catch (e) {} }
  // A shared link can carry the key after "#key=", so opening it unlocks without typing (handy inside GroupMe,
  // whose built-in browser doesn't share saved data with Safari). The key is removed from the address bar afterwards.
  function fromLink() {
    var m = /[#&]key=([A-Za-z0-9_-]+)/.exec(location.hash);
    if (!m) return null;
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
    var k = m[1].replace(/-/g, "+").replace(/_/g, "/");
    while (k.length % 4) k += "=";
    return k;
  }
  if (!window.crypto || !crypto.subtle) {
    lock.hidden = false; err.textContent = "Open this page over https to unlock it."; err.hidden = false; return;
  }
  var had = saved();
  var tries = [fromLink(), had].filter(Boolean);
  for (var i = 0; i < tries.length; i++) {
    try { var opened = await decrypt(bytes(tries[i])); if (!had) firstUnlock("link"); keep(tries[i]); show(opened); return; } catch (e) {}
  }
  forget();
  lock.hidden = false; input.focus();
  if ((window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone) {
    document.querySelector("[data-standalone]").hidden = false;
  }
  // A share link opened in this same tab only changes the part after "#", which doesn't reload the page: try it now.
  window.addEventListener("hashchange", async function () {
    var k = fromLink();
    if (!k) return;
    try { var opened = await decrypt(bytes(k)); firstUnlock("link"); keep(k); show(opened); }
    catch (e) { err.textContent = "That link didn't unlock the site (it may be from before a password change). Type the password instead."; err.hidden = false; }
  });
  form.addEventListener("submit", async function (ev) {
    ev.preventDefault(); err.hidden = true; err.textContent = errText;
    var btn = form.querySelector("button"); btn.disabled = true; btn.textContent = "Unlocking…";
    try {
      var pw = new TextEncoder().encode(input.value.trim().toLowerCase());
      var base = await crypto.subtle.importKey("raw", pw, "PBKDF2", false, ["deriveBits"]);
      var raw = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: hex(env.salt), iterations: env.iter }, base, 256);
      var page = await decrypt(new Uint8Array(raw));
      firstUnlock("password");
      keep(b64(raw));
      show(page);
    } catch (e) {
      err.hidden = false; btn.disabled = false; btn.textContent = "Unlock"; input.select();
    }
  });
})();
</script>
